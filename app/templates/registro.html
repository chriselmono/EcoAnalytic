<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../static/css/login.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Registro</title>

</head>

<body>

    <div class="login-container">
        <div class="card p-4">
            <div class="header">
                <h2>Registrarse</h2>
            </div>

            <div class="card-body">
                <form method="post" action="/registro">
                    <div class="mb-3">
                        <label class="form-label">Nombre(s): </label>
                        <input type="text" class="form-control" placeholder="Nombre(s) " name="nombre">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Apellidos: </label>
                        <input type="text" class="form-control" placeholder="Apellidos" name="apellido">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Numero Celular: </label>
                        <input type="number" class="form-control" placeholder="3** *******" name="telefono">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico: </label>
                        <input type="mail" class="form-control" placeholder="correo@ejemplo.com" name="correo">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Usuario: </label>
                        <input type="text" class="form-control" placeholder="Usuario" name="usuario">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" placeholder="********" name="contraseña" maxlength="14" minlength="6">
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-primary">Entrar</button>
                    </div>

                    <div class="text-center mt-3">
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
